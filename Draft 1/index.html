<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Unique Hope Club</title>
  <!-- Google Fonts: Playfair Display -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap">
  <style>
    /* Layout and Container Styles */
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      min-height: 100vh;
      min-width: 100vw;
      overflow: hidden;
      box-sizing: border-box;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      padding: 0;
    }
    .background {
      position: fixed;
      top: 0;
      left: -1;
      width: 102vw;
      height: 102vh;
      background-image: url('./images/background.webp');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      filter: blur(2px);
      z-index: -1;
    }
    .content-box {
      position: relative;
      background: rgba(255,255,255,0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.25);
      width: 480px;
      max-width: 95vw;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: no-drag;
      pointer-events: auto;
    }
    /* Logo and Title */
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: white;
      padding: 8px;
      border: 1px solid #ddd;
      object-fit: contain;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.5em;
      margin-bottom: 20px;
      color: #5C6AC4;
    }
    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
      background: #f0f0f0;
    }
    .tab.active {
      background: crimson;
      color: white;
    }
    /* Forms */
    .form-container {
      display: none;
    }
    .form-container.active {
      display: block;
    }
    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      background: crimson;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .back-btn {
      background: #888;
      margin-top: 20px;
    }
    /* Dashboard and Teacher Styles */
    .dashboard, .new-entry, .teacher-dashboard {
      display: none;
      background-color: transparent;
      overflow: auto;
    }
    .admin-dashboard-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      box-sizing: border-box;
      padding: 0;
    }
    .admin-dashboard-content {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 60px 60px 40px 60px;
      width: 80vw;
      max-width: 700px;
      min-width: 340px;
      min-height: 400px;
      margin-left: 5vw;
      margin-right: 5vw;
      z-index: 2;
      position: relative;
    }
    .teacher-dashboard {
      min-height: 100vh;
      width: 100vw;
      text-align: left;
      padding: 0;
      background: #fff;
    }
    .student-list {
      margin-top: 20px;
      text-align: left;
      padding: 0 20px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }
    .student-list div {
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid #ddd;
    }
    /* Teacher Dashboard Specific Styles */
    .lesson-display-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      height: 100%;
      min-width: 0;
      position: relative;
    }
    .lesson-week-label {
      font-size: 38px;
      font-weight: 800;
      color: #c00;
      margin-bottom: 24px;
      margin-left: 18px;
      margin-top: 10px;
      text-align: left;
      letter-spacing: 1px;
    }
    .lesson-banner {
      width: calc(100% + 0.1cm);
      background: rgb(220, 20, 60);
      border-radius: 0;
      border: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      margin-bottom: 0;
      box-sizing: border-box;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      height: 44px;
      min-height: 44px;
      max-width: 900px;
      min-width: 500px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }
    .zoom-icon {
      display: inline-block;
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      margin-left: 10px;
      margin-right: 2px;
      user-select: none;
      transition: color 0.2s;
    }
    .zoom-icon.active {
      color: #fff;
      font-weight: 900;
      text-shadow: 0 0 2px #fff, 0 0 4px #c00;
    }
    .lesson-display-box {
      flex: 1;
      border: 2px solid #ccc;
      border-radius: 0 0 8px 8px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #fff;
      width: 100%;
      max-width: 900px;
      min-height: calc(110px - 5cm);
      min-width: 500px;
      cursor: pointer;
      transition: box-shadow 0.2s, background 0.2s, border-color 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      margin-top: -2px;
    }
    .lesson-actions {
      width: 95%;
      max-width: 900px;
      min-width: 500px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 10px;
    }
    .lesson-display-box.active {
      background: #e0e0e0;
      border-color: #888;
      box-shadow: 0 4px 24px rgba(80,80,80,0.12);
    }
    .lesson-display-box:hover {
      box-shadow: 0 4px 24px rgba(80,80,80,0.10);
      border-color: #888;
    }
    .vertical-separator-right {
      width: 0;
      border-left: 2px dashed #d1d1d1;
      height: 90%;
      margin: 0 18px;
      align-self: stretch;
      z-index: 1;
    }
    .teacher-dashboard-content {
      position: relative;
    }
    .vertical-separator {
      width: 0;
      border-left: 2px dashed #d1d1d1;
      height: 90%;
      position: absolute;
      left: 0;
      top: 5%;
      z-index: 1;
      margin-left: -18px;
    }
    .teacher-dashboard-main {
      display: flex;
      height: calc(100vh - 60px);
      padding: 0;
      gap: 0;
    }
    .weeks-sidebar {
      width: calc(180px + 1cm);
      background: #f7f7f7;
      border: 2.5px solid #e0e0e0;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 8px 0.5cm 2px 0;
      gap: 10px;
      min-width: calc(140px + 1cm);
      box-sizing: border-box;
      margin: 0 18px 0 0;
    }
    .week-block {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 24px;
      margin: 0 10px;
      border-radius: 8px;
      background: #fff;
      color: #c00;
      font-weight: 500;
      font-size: 18px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: background 0.2s, color 0.2s, border 0.2s;
      margin-bottom: 4px;
      min-width: 120px;
      max-width: 100%;
    }
    .week-block.selected {
      background: crimson;
      color: #fff;
      border: 2px solid #b3002d;
      font-weight: 700;
    }
    .teacher-dashboard-content {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 30px;
      padding: 40px 60px 40px 60px;
      background: #fff;
      min-width: 0;
      max-width: 1400px;
      margin: 0 auto;
    }
    .teacher-dashboard-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }
    .student-info-section {
      width: 320px;
      min-width: 220px;
      max-width: 340px;
      align-self: flex-start;
      margin-bottom: 0;
    }
    .teacher-banner {
      background: rgb(220, 20, 60);
      color: white;
      padding: 15px 30px;
      text-align: center;
      font-size: 24px;
      position: relative;
      box-shadow: 0 4px 16px rgba(220,0,50,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
    }
    .teacher-back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 16px;
      padding: 6px 18px;
      cursor: pointer;
      color: #fff;
      transition: background 0.2s;
      font-weight: 500;
    }
    .teacher-back-btn:hover {
      background: rgba(255,255,255,0.22);
    }
    .teacher-welcome {
      margin: 0 auto;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <!-- Login Box -->
  <div class="content-box" id="loginBox">
    <div class="logo-container">
      <img src="./images/logo.png" alt="Club Logo" class="logo">
    </div>
    <div class="title">The Unique<br>Hope Club</div>
    <div class="tabs">
      <div class="tab active" data-target="signinForm">Sign In</div>
      <div class="tab" data-target="adminForm">Admin</div>
    </div>
    <div id="signinForm" class="form-container active">
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>
    <div id="adminForm" class="form-container">
      <form id="adminLoginForm">
        <input type="text" id="adminUser" placeholder="Admin Username" required>
        <input type="password" id="adminPass" placeholder="Admin Password" required>
        <button type="submit">Admin Login</button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="admin-dashboard-wrapper">
      <div class="admin-dashboard-content">
        <h1>Welcome, Lucas!</h1>
        <p>You have successfully logged into The Unique Hope Club dashboard.</p>
        <button id="newEntryBtn">New Student/Teacher</button>
        <button class="back-btn" id="adminBackHome" style="margin-left:10px;">Back to Homepage</button>
      </div>
    </div>
  </div>

  <!-- New Student/Teacher Form -->
   
  <div class="new-entry" id="newEntry">
    <h2>New Student/Teacher</h2>
    <form id="newEntryForm">
      <h3>Student Info</h3>
      <input type="text" id="studentName" placeholder="Student Name" required>
      <input type="text" id="studentGrade" placeholder="Grade" required>
      <input type="text" id="studentContact" placeholder="Contact Info" required>
      <input type="text" id="studentTime" placeholder="Available Time (bullet points separated by commas)" required>
      <h3>Teacher Info</h3>
      <input type="text" id="teacherName" placeholder="Teacher Name" required>
      <input type="text" id="teacherSchool" placeholder="School" required>
      <input type="text" id="teacherUsername" placeholder="Username" required>
      <input type="password" id="teacherPassword" placeholder="Password" required>
      <button type="submit">Save</button>
    </form>
    <button class="back-btn" id="backDashboard">Back</button>
    <div class="student-list" id="studentList">
      <h3>Students Info:</h3>
    </div>
  </div>

  <!-- Teacher Dashboard -->
  <div class="teacher-dashboard" id="teacherDashboard">
    <!-- Top Banner -->
    <div class="teacher-banner">
      <span id="teacherBack" class="teacher-back-btn">&#8592; Back to Homepage</span>
      <span class="teacher-welcome">Welcome <span id="welcomeTeacher"></span></span>
    </div>
    <div class="teacher-dashboard-main">
      <div class="weeks-sidebar" style="position:relative;">
        <div id="weekCatalogue"></div>
  <div style="display:flex;justify-content:center;align-items:flex-end;position:absolute;bottom:24px;left:-0.18cm;width:100%;">
          <img src="images/Rose.png" alt="Rose" style="width:90px;height:90px;object-fit:contain;opacity:0.92;">
        </div>
      </div>
      <div class="teacher-dashboard-content">
        <div class="lesson-display-wrapper">
          <div class="lesson-week-label" id="lessonWeekLabel">Week 1:</div>
          <div style="position:relative; width:100%; max-width:900px; min-width:500px; height:44px;">
            <div class="lesson-banner">
              <span style="flex:1; text-align:left; color:#fff; font-size:20px; font-weight:500; margin-left:0.15cm;">Upload class screenshot</span>
              <span class="zoom-icon" id="zoomInIcon" style="font-size:32px; font-weight:900;">＋</span>
              <span style="font-size:10px; font-weight:900; margin:0 4px;"> </span>
              <span style="font-size:32px; font-weight:900; margin:0 8px;">/</span>
              <span class="zoom-icon" id="zoomOutIcon" style="font-size:32px; font-weight:900;">－</span>
              <span style="font-size:6px; font-weight:900; margin:0 4px;"> </span>
              <span id="zoomPercent" style="font-size:18px; font-weight:500; margin-left:8px; margin-right:18px; color:#fff;">100%</span>
              <span id="fullscreenBtn" style="font-size:32px; font-weight:700; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: font-weight 0.2s;">⛶</span>
            </div>
          </div>
          <div class="lesson-display-box" id="lessonDisplayBox">
            <div id="fullscreenOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center;">
              <img id="fullscreenImage" src="" alt="Lesson Fullscreen" style="max-width:90vw; max-height:90vh; box-shadow:0 0 40px #000; border-radius:16px; display:block; margin:auto;">
            </div>
            <span id="uploadHint" style="position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;color:#bbb;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center;pointer-events:none;">upload image</span>
            <img id="lessonImage" src="" alt="Lesson" draggable="true" style="max-width:100%; max-height:100%; cursor:grab; transition: transform 0.3s; display:none; margin:auto; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
          </div>
          <div class="lesson-actions" style="display:flex; width:100%; max-width:900px; min-width:500px; margin-top:5px; margin-bottom:0; position:relative; left:0;">
            <button id="deleteLesson" style="flex:1; margin-right:8px; background:crimson; color:white; font-weight:700; font-size:17px; border-radius:9px; height:40px;">Delete</button>
            <button id="submitLesson" style="flex:1; margin-left:8px; background:crimson; color:white; font-weight:700; font-size:17px; border-radius:9px; height:40px;">Submit</button>
          </div>
        </div>
        <div class="vertical-separator-right"></div>
        <div class="teacher-dashboard-section student-info-section" style="border:2px solid #ccc; border-radius:8px; padding:20px; overflow-y:auto;">
          <h3>Student Info:</h3>
          <div id="studentInfo"></div>
        </div>
      </div>
    </div>
  </div>

<input type="file" id="fileInput" style="display:none" accept="image/*">


<script>
document.addEventListener('DOMContentLoaded', function() {
  function updateSubmitButtonState() {
    const lessonData = currentTeacher?.lessons?.[currentWeek];
    const hasImage = lessonData && lessonData.src;
    submitLessonBtn.disabled = !hasImage;
    submitLessonBtn.style.opacity = submitLessonBtn.disabled ? '0.5' : '1';
    submitLessonBtn.style.cursor = submitLessonBtn.disabled ? 'not-allowed' : 'pointer';
  }
  // --- DOM References ---
  const loginBox = document.getElementById('loginBox');
  const dashboard = document.getElementById('dashboard');
  const newEntry = document.getElementById('newEntry');
  const teacherDashboard = document.getElementById('teacherDashboard');
  const loginForm = document.getElementById('loginForm');
  const adminForm = document.getElementById('adminLoginForm');
  const adminBackHome = document.getElementById('adminBackHome');
  const newEntryBtn = document.getElementById('newEntryBtn');
  const backDashboard = document.getElementById('backDashboard');
  const newEntryForm = document.getElementById('newEntryForm');
  const studentList = document.getElementById('studentList');
  const welcomeTeacher = document.getElementById('welcomeTeacher');
  const teacherBack = document.getElementById('teacherBack');
  const weekCatalogue = document.getElementById('weekCatalogue');
  const lessonDisplayBox = document.getElementById('lessonDisplayBox');
  const lessonImage = document.getElementById('lessonImage');
  const fileInput = document.getElementById('fileInput');

  lessonImage.addEventListener('dragstart', (e) => e.preventDefault());

  const zoomInIcon = document.getElementById('zoomInIcon');
  const zoomOutIcon = document.getElementById('zoomOutIcon');
  const zoomPercent = document.getElementById('zoomPercent');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fullscreenOverlay = document.getElementById('fullscreenOverlay');
  const fullscreenImage = document.getElementById('fullscreenImage');
  const uploadHint = document.getElementById('uploadHint');
  const deleteLessonBtn = document.getElementById('deleteLesson');
  const submitLessonBtn = document.getElementById('submitLesson');
  const lessonBanner = document.querySelector('.lesson-banner');
  const bannerTextEl = lessonBanner ? lessonBanner.querySelector('span') : null;
  const studentInfoDiv = document.getElementById('studentInfo');
  const backgroundDiv = document.querySelector('.background');
// --- Tab Switching Logic ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-container').forEach(fc => fc.classList.remove('active'));

  this.classList.add('active');
  document.getElementById(this.dataset.target).classList.add('active');
  });
});

  // --- Local Storage ---
  let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
  let students = JSON.parse(localStorage.getItem('students')) || [];
  const adminCredentials = JSON.parse(localStorage.getItem('admin')) || { username: "Lucas", password: "12345678" };

  function saveData(){
    localStorage.setItem('teachers', JSON.stringify(teachers));
    localStorage.setItem('students', JSON.stringify(students));
    localStorage.setItem('admin', JSON.stringify(adminCredentials));
    renderStudentList();
  }

  function renderStudentList(){
    studentList.innerHTML = "<h3>Students Info:</h3>";
    students.forEach(s => {
      const div = document.createElement('div');
      const timePoints = s.timeSlots ? s.timeSlots.map(t => `<li>${t}</li>`).join("") : '';
      div.innerHTML = `<strong>Name:</strong> ${s.name}<br> <strong>Grade:</strong> ${s.grade}<br> <strong>Contact:</strong> ${s.contact}<br> <strong>Time Slots:</strong><ul>${timePoints}</ul>`;
      studentList.appendChild(div);
    });
  }

  // --- Login Handling ---
  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const teacher = teachers.find(t => t.username === username && t.password === password);

    if(username === adminCredentials.username && password === adminCredentials.password){
      loginBox.style.display = "none";
      dashboard.style.display = "block";
    } else if(teacher){
      loginBox.style.display = "none";
      showTeacherDashboard(teacher);
    } else {
      alert("Invalid login credentials.");
    }
  });

  adminForm.addEventListener('submit', function(e){
    e.preventDefault();
    const adminUser = document.getElementById('adminUser').value;
    const adminPass = document.getElementById('adminPass').value;
    if(adminUser === adminCredentials.username && adminPass === adminCredentials.password){
      loginBox.style.display = "none";
      dashboard.style.display = "block";
    } else {
      alert("Invalid admin credentials.");
    }
  });

  // --- Admin Dashboard / New Entry ---
  newEntryBtn.addEventListener('click', () => {
    dashboard.style.display = "none";
    newEntry.style.display = "block";
    renderStudentList();
  });

  backDashboard.addEventListener('click', () => {
    newEntry.style.display = "none";
    dashboard.style.display = "block";
  });

  newEntryForm.addEventListener('submit', e => {
    e.preventDefault();
    const student = {
      name: document.getElementById('studentName').value,
      grade: document.getElementById('studentGrade').value,
      contact: document.getElementById('studentContact').value,
      timeSlots: document.getElementById('studentTime').value.split(",").map(t => t.trim()),
      teacherUsername: document.getElementById('teacherUsername').value
    };
    const teacher = {
      name: document.getElementById('teacherName').value,
      school: document.getElementById('teacherSchool').value,
      username: document.getElementById('teacherUsername').value,
      password: document.getElementById('teacherPassword').value,
      lessons: {},
      studentName: document.getElementById('studentName').value
    };
    students.push(student);
    teachers.push(teacher);
    saveData();
    alert("Student and Teacher saved successfully!");
    newEntryForm.reset();
  });

  adminBackHome.addEventListener('click', () => {
    dashboard.style.display = "none";
    loginBox.style.display = "block";
  });

  // --- Teacher Dashboard ---
  let currentTeacher = null, currentWeek = 1, currentScale = 1;
  // --- Zoom and Fullscreen Logic ---
  function setZoom(scale) {
    currentScale = Math.max(0.2, Math.min(3, scale));
    lessonImage.style.transform = `scale(${currentScale}) translate(-50%,-50%)`;
    zoomPercent.textContent = Math.round(currentScale * 100) + '%';
  }

  zoomInIcon.addEventListener('click', function(e) {
    setZoom(currentScale + 0.1);
  });
  zoomOutIcon.addEventListener('click', function(e) {
    setZoom(currentScale - 0.1);
  });

  // Pinch-to-zoom (trackpad/touch)
  let lastTouchDist = null;
  lessonDisplayBox.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastTouchDist = Math.sqrt(dx*dx + dy*dy);
    }
  });
  lessonDisplayBox.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && lastTouchDist) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const newDist = Math.sqrt(dx*dx + dy*dy);
      const delta = (newDist - lastTouchDist) / 200;
      setZoom(currentScale + delta);
      lastTouchDist = newDist;
      e.preventDefault();
    }
  }, { passive: false });
  lessonDisplayBox.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) lastTouchDist = null;
  });

  // Trackpad zoom (wheel event with ctrlKey)
  lessonDisplayBox.addEventListener('wheel', function(e) {
    if (e.ctrlKey) {
      setZoom(currentScale + (e.deltaY < 0 ? 0.1 : -0.1));
      e.preventDefault();
    }
  }, { passive: false });
// --- Image Panning Logic ---
let isPanning = false;
let startX = 0, startY = 0;
let offsetX = 0, offsetY = 0;

lessonImage.addEventListener('mousedown', (e) => {
  isPanning = true;
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;
  lessonImage.style.cursor = 'grabbing';
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  offsetX = e.clientX - startX;
  offsetY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isPanning = false;
  lessonImage.style.cursor = 'grab';
});

function updateTransform() {
  // Apply scale and translation together
  lessonImage.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${currentScale})`;
}

  // Fullscreen logic
  fullscreenBtn.addEventListener('click', function() {
    if (!lessonImage.src || lessonImage.style.display !== 'block') return;
    fullscreenOverlay.style.display = 'flex';
    fullscreenImage.src = lessonImage.src;
    setTimeout(() => {
      fullscreenImage.focus();
    }, 100);
  });
  fullscreenOverlay.addEventListener('click', function(e) {
    if (e.target === fullscreenOverlay) {
      fullscreenOverlay.style.display = 'none';
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && fullscreenOverlay.style.display === 'flex') {
      fullscreenOverlay.style.display = 'none';
    }
  });

  // Initial zoom percent
  zoomPercent.textContent = '100%';

  function showTeacherDashboard(teacher){
    currentTeacher = teacher;
    welcomeTeacher.textContent = teacher.name;
    teacherDashboard.style.display = "block";
    if(backgroundDiv) backgroundDiv.style.display = "none";
    generateWeeks();
    renderStudentInfo();
    loadWeek(1);
  }

  teacherBack.addEventListener('click', () => {
    teacherDashboard.style.display = "none";
    loginBox.style.display = "block";
    if(backgroundDiv) backgroundDiv.style.display = "block";
  });

  function generateWeeks(){
    weekCatalogue.innerHTML = "";
    for(let i=1;i<=10;i++){
      const block = document.createElement('div');
      block.className = 'week-block' + (i === currentWeek ? ' selected' : '');
      block.dataset.week = i;
      const isComplete = !!(currentTeacher?.lessons?.[i]?.submitted);
      block.innerHTML = `<span>${isComplete ? "🟢" : "⚪"}</span>&nbsp;Week ${i}`;
      block.addEventListener('click', () => {
        currentWeek = i;
        highlightSelectedWeek();
        loadWeek(i);
      });
      weekCatalogue.appendChild(block);
    }
    highlightSelectedWeek();
  }

  function highlightSelectedWeek(){
    Array.from(weekCatalogue.children).forEach((b, idx) => {
      b.classList.toggle('selected', idx+1 === currentWeek);
    });
  }

  function renderStudentInfo(){
    studentInfoDiv.innerHTML = "";
    // Only show the student(s) that correspond to the logged-in teacher
    const myStudents = students.filter(s => s.teacherUsername === currentTeacher.username);
    if (myStudents.length === 0) {
      studentInfoDiv.innerHTML = '<em>No student assigned.</em>';
      return;
    }
    myStudents.forEach(s => {
      const div = document.createElement('div');
      const timePoints = s.timeSlots.map(t => `<li>${t}</li>`).join("");
      div.innerHTML = `<strong>Name:</strong> ${s.name}<br> <strong>Grade:</strong> ${s.grade}<br> <strong>Contact:</strong> ${s.contact}<br> <strong>Time Slots:</strong><ul>${timePoints}</ul>`;
      studentInfoDiv.appendChild(div);
    });
  }

  // --- Lesson Image Upload ---
  lessonDisplayBox.addEventListener('click', e => {
    if (e.target.classList.contains('zoom-icon') || e.target.id === 'fullscreenBtn') return;
    if (lessonImage.style.display !== 'block') fileInput.click();
  });

  fileInput.addEventListener('change', function(){
    const file = this.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(e){
        if (!currentTeacher.lessons) currentTeacher.lessons = {};
        if (!currentTeacher.lessons[currentWeek]) currentTeacher.lessons[currentWeek] = { src: '', submitted: false };

        lessonImage.src = e.target.result;
        currentTeacher.lessons[currentWeek].src = lessonImage.src;
        currentTeacher.lessons[currentWeek].submitted = false;

        lessonImage.style.display = 'block';
        uploadHint.style.display = 'none';
        currentScale = 1;
        lessonImage.style.transform = `scale(${currentScale}) translate(-50%,-50%)`;

        updateLessonUI();
        saveData();
      };
      reader.readAsDataURL(file);
      this.value = "";
    }
  });


  function updateLessonUI() {
  updateSubmitButtonState();
    const lessonData = currentTeacher?.lessons?.[currentWeek] || { src: '', submitted: false };
    const isSubmitted = !!lessonData.submitted;

    // Week label
    document.getElementById('lessonWeekLabel').textContent = `Week ${currentWeek}${isSubmitted ? ': Submitted' : ''}`;

    // Banner text
    if (bannerTextEl) {
      bannerTextEl.textContent = (lessonData.src ? (isSubmitted ? "Screenshot uploaded" : "Upload class screenshot") : "Upload class screenshot");
    }

    // Image display
    if (lessonData.src) {
      lessonImage.src = lessonData.src;
      lessonImage.style.display = 'block';
      uploadHint.style.display = 'none';
    } else {
      lessonImage.style.display = 'none';
      uploadHint.style.display = 'flex';
    }

    // Buttons (keep same width always)
    deleteLessonBtn.style.display = (lessonData.src && !isSubmitted) ? 'inline-block' : 'none';
    submitLessonBtn.textContent = isSubmitted ? 'Unsubmit' : 'Submit';
    submitLessonBtn.style.flex = deleteLessonBtn.style.display === 'none' ? '1' : '1';

    // Update sidebar emoji
    const weekBlock = weekCatalogue.children[currentWeek - 1];
    if (weekBlock) {
      weekBlock.innerHTML = `<span>${isSubmitted ? "🟢" : "⚪"}</span>&nbsp;Week ${currentWeek}`;
    }
  }

  submitLessonBtn.addEventListener('click', () => {
    if (!currentTeacher?.lessons?.[currentWeek]?.src) {
      alert("Please upload an image before submitting!");
      return;
    }

    currentTeacher.lessons[currentWeek].submitted = !currentTeacher.lessons[currentWeek].submitted;
    generateWeeks();
    updateLessonUI();
    saveData();
  });

  deleteLessonBtn.addEventListener('click', () => {
    if (!currentTeacher?.lessons?.[currentWeek]?.src) return;

    currentTeacher.lessons[currentWeek] = null;
    generateWeeks();
    updateLessonUI();
    saveData();
  });

  function loadWeek(week){
    currentWeek = week;
    generateWeeks();
    updateLessonUI();
  }
});

</script>
