<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - The Unique Hope</title>
  <link rel="icon" href="images/unique_hope_logo_cutout_keep_text.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
   
    body {
        display: flex; justify-content: center; align-items: center; min-height: 100vh;
        background: var(--color-bg-secondary);
        position: relative; overflow: hidden;
    }
    
    .login-container {
        width: 100%; max-width: 460px;
        position: relative; z-index: 10;
        padding: 20px;
    }

    .login-card {
        padding: 48px 40px;
        border-radius: 32px;
        text-align: center;
    }

    .brand-logo {
        font-family: var(--font-title);
        font-size: 1.75rem; font-weight: 700; color: var(--color-primary-dark);
        margin-bottom: 8px; display: block;
    }

    .tabs {
        display: flex; background: var(--color-bg-secondary);
        padding: 4px; border-radius: var(--radius-md);
        margin: 24px 0;
    }
    
    .tab {
        flex: 1; padding: 10px; text-align: center;
        font-size: 0.9rem; font-weight: 600; color: var(--color-text-secondary);
        border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition-fast);
        border: none;
        background: transparent;
    }
    
    .tab.active {
        background: white; color: var(--color-primary-dark);
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .form-group { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .input-wrapper { margin-bottom: 20px; text-align: left; }
    
    .lang-btn {
        position: fixed; top: 24px; right: 24px; z-index: 20;
        background: white; padding: 8px 16px; border-radius: 20px;
        font-weight: 600; font-size: 0.85rem; cursor: pointer;
        border: 1px solid rgba(0,0,0,0.05); box-shadow: var(--glass-shadow);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="glass-card login-card">
        <span class="brand-logo">The Unique Hope</span>
        <p class="text-lead" style="font-size: 1rem; margin-bottom: 24px;" data-i18n="login.subtitle">Sign in to continue your journey</p>

        <div class="tabs">
            <button type="button" class="tab active" data-role="teacher" data-i18n="login.roleTeacher">Teacher</button>
            <button type="button" class="tab" data-role="student" data-i18n="login.roleStudent">Student</button>
            <button type="button" class="tab" data-role="admin" data-i18n="login.roleAdmin">Admin</button>
        </div>

        <div class="form-group">
            <form id="loginForm">
                <div class="input-wrapper">
                    <label for="identifier" class="input-label" data-i18n="login.identifier">Email or Username</label>
                    <input id="identifier" type="text" name="identifier" class="form-control" required autocomplete="username">
                </div>
                <div class="input-wrapper">
                    <label for="password" class="input-label" data-i18n="login.password">Password</label>
                    <input id="password" type="password" name="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;" id="loginBtn" data-i18n="login.signIn">Sign In</button>
            </form>
        </div>

        <p style="margin-top: 20px; font-size: 0.9rem;">
          <a href="signup.html" style="color: var(--color-primary-dark);" data-i18n="signup.backLogin">Want to sign up? Click here</a>
        </p>
    </div>
  </div>

  <a href="index.html" style="position: fixed; top: 24px; left: 24px; z-index: 20; background: white; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(0,0,0,0.05); box-shadow: var(--glass-shadow); color: var(--color-primary-dark);" data-i18n="nav.backHome">&larr; Home</a>
  <button class="lang-btn" onclick="toggleLang()" data-i18n="nav.switchLang">中文</button>

  <script type="module" src="js/runtime-config.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/demo-api.js"></script>
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/toast.js"></script>

  <script>
    let currentRole = 'teacher';

    const roleRedirects = { admin: 'admin.html', teacher: 'teacher.html', student: 'student.html' };
    const loginBtn = document.getElementById('loginBtn');

    function updateButtonLabel() {
      const key = currentRole === 'admin' ? 'login.dashboardAccess' : 'login.signIn';
      loginBtn.textContent = I18nUtils.t(key);
      loginBtn.setAttribute('data-i18n', key);
    }

    function toggleLang() {
      I18nUtils.toggleLang();
      updateButtonLabel();
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentRole = this.dataset.role;
        updateButtonLabel();
      });
    });

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const identifier = form.identifier.value.trim();
      const password = form.password.value;
      try {
        await ApiClient.login({ identifier, password, role: currentRole });
        window.location.href = roleRedirects[currentRole];
      } catch (error) {
        showToast(error.message || I18nUtils.t('login.invalid'), 'error');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      I18nUtils.applyTranslations();
      updateButtonLabel();
    }, { once: true });
  </script>
</body>
</html>
