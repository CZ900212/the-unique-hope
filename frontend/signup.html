<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Signup - The Unique Hope</title>
  <link rel="icon" href="images/unique_hope_logo_cutout_keep_text.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: var(--color-bg-secondary);
      position: relative; overflow: hidden;
    }
    .signup-container {
      width: 100%; max-width: 500px;
      position: relative; z-index: 10;
      padding: 20px;
    }
    .signup-card {
      padding: 48px 40px;
      border-radius: 32px;
      text-align: center;
    }
    .brand-logo {
      font-family: var(--font-title);
      font-size: 1.75rem; font-weight: 700; color: var(--color-primary-dark);
      margin-bottom: 8px; display: block;
    }
    .input-wrapper { margin-bottom: 20px; text-align: left; }
    .lang-btn {
      position: fixed; top: 24px; right: 24px; z-index: 20;
      background: white; padding: 8px 16px; border-radius: 20px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05); box-shadow: var(--glass-shadow);
    }
    .signup-links {
      margin-top: 24px; display: flex; flex-direction: column; gap: 8px;
      font-size: 0.9rem;
    }
    .signup-links a { color: var(--color-primary-dark); }
  </style>
</head>
<body>

  <div class="signup-container">
    <div class="glass-card signup-card">
      <span class="brand-logo">The Unique Hope</span>
      <p class="text-lead" style="font-size: 1rem; margin-bottom: 24px;" data-i18n="signup.pageTitle">Student Signup</p>

      <form id="signupForm">
        <div class="input-wrapper">
          <label for="childName" class="input-label" data-i18n="signup.childName">Child's Name</label>
          <input id="childName" type="text" class="form-control" required maxlength="120">
        </div>
        <div class="input-wrapper">
          <label for="age" class="input-label" data-i18n="signup.age">Age</label>
          <input id="age" type="number" class="form-control" required min="3" max="18">
        </div>
        <div class="input-wrapper">
          <label for="phone" class="input-label" data-i18n="signup.phone">Phone Number</label>
          <input id="phone" type="tel" class="form-control" required minlength="6" maxlength="20">
        </div>
        <div class="input-wrapper">
          <label for="contact" class="input-label" data-i18n="signup.contact">Other Contact (optional)</label>
          <input id="contact" type="text" class="form-control" maxlength="255">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;" id="submitBtn" data-i18n="signup.submit">Submit Signup</button>
      </form>

      <div class="signup-links">
        <a href="index.html" data-i18n="signup.backHome">&larr; Back to Home</a>
        <a href="login.html" data-i18n="signup.backLogin">Already have an account? Sign in</a>
      </div>
    </div>
  </div>

  <button class="lang-btn" onclick="toggleLang()" data-i18n="nav.switchLang">中文</button>

  <script type="module" src="js/runtime-config.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/demo-api.js"></script>
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/toast.js"></script>

  <script>
    function toggleLang() {
      I18nUtils.toggleLang();
    }

    document.getElementById('signupForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = I18nUtils.t('common.submitting');

      try {
        const payload = {
          childName: document.getElementById('childName').value.trim(),
          age: Number(document.getElementById('age').value),
          phone: document.getElementById('phone').value.trim(),
          contact: document.getElementById('contact').value.trim() || undefined
        };
        await ApiClient.createStudentSignup(payload);
        showToast(I18nUtils.t('signup.success'), 'success');
        e.target.reset();
      } catch (error) {
        showToast(error.message || I18nUtils.t('common.submitFailed'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = I18nUtils.t('signup.submit');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      I18nUtils.applyTranslations();
    }, { once: true });
  </script>
</body>
</html>
