<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - The Unique Hope</title>
<link rel="icon" href="images/unique_hope_logo_cutout_keep_text.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <a href="index.html" class="sidebar-brand" style="text-decoration:none;">The Unique Hope</a>
    <div class="sidebar-menu">
      <button type="button" class="sidebar-item active" onclick="switchView('pairings', this)">
        <span></span> <span data-i18n="admin.menuPairings">Pairings</span>
      </button>
      <button type="button" class="sidebar-item" onclick="switchView('progress', this)">
        <span></span> <span data-i18n="admin.menuProgress">Progress</span>
      </button>
      <button type="button" class="sidebar-item" onclick="switchView('signups', this)">
        <span></span> <span data-i18n="admin.menuSignups">Signups</span>
      </button>
      <button type="button" class="sidebar-item" onclick="toggleLang()" style="margin-top: auto;">
        <span></span> <span data-i18n="nav.switchLang">中文</span>
      </button>
      <button type="button" class="sidebar-item" onclick="logout()" style="color: var(--status-error);">
        <span></span> <span data-i18n="nav.logout">Logout</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    
    <!-- Pairings View -->
    <div id="pairings" class="view active">
      <div class="dash-header">
        <h2 class="display-3" data-i18n="admin.managePairings">Manage Pairings</h2>
        <button class="btn-primary" onclick="openModal()" data-i18n="admin.newPairing">+ New Pairing</button>
      </div>

      <div class="dash-card">
        <input type="text" id="searchInput" class="form-control" style="margin-bottom: 20px;" data-i18n-placeholder="admin.searchPlaceholder" placeholder="Search students or teachers..." onkeyup="filterTable()">
        
        <div class="table-responsive">
          <table id="pairingsTable">
            <thead>
              <tr>
                <th data-i18n="admin.thStudent">Student</th>
                <th data-i18n="admin.thStudentLogin">Student Login</th>
                <th data-i18n="admin.thTeacher">Teacher</th>
                <th data-i18n="admin.thTeacherLogin">Teacher Login</th>
                <th data-i18n="admin.thAction">Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="emptyState" style="padding: 40px; text-align: center; color: var(--color-text-secondary); display: none;" data-i18n="admin.noPairings">
            No pairings found.
        </div>
        <div id="paginationControls" style="display: flex; justify-content: center; align-items: center; gap: 12px; padding: 16px 0;">
            <button class="btn-secondary" id="prevPageBtn" onclick="goToPage(currentPage - 1)" disabled style="min-width: 80px;" data-i18n="common.prev">Prev</button>
            <span id="pageInfo" style="font-size: 0.9rem; color: var(--color-text-secondary);"></span>
            <button class="btn-secondary" id="nextPageBtn" onclick="goToPage(currentPage + 1)" disabled style="min-width: 80px;" data-i18n="common.next">Next</button>
        </div>
      </div>
    </div>

    <!-- Progress View -->
    <div id="progress" class="view" style="display: none;">
      <div class="dash-header">
        <h2 class="display-3" data-i18n="admin.courseProgress">Course Progress</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="exportCSV()" data-i18n="admin.exportCSV">Export CSV</button>
            <button class="btn-secondary" onclick="window.print()" data-i18n="admin.printRecords">Print</button>
        </div>
      </div>

      <div class="dash-card">
        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <button type="button" class="status-chip status-chip-button info" onclick="setFilter('all')" style="min-width: 60px; text-align: center;" data-i18n="admin.filterAll">All</button>
            <button type="button" class="status-chip status-chip-button warning" onclick="setFilter('teacher-leave')" style="min-width: 60px; text-align: center;" data-i18n="admin.filterTeacherLeave">Teacher Leave</button>
            <button type="button" class="status-chip status-chip-button info" onclick="setFilter('student-leave')" style="min-width: 60px; text-align: center;" data-i18n="admin.filterStudentLeave">Student Leave</button>
        </div>

        <div class="table-responsive">
          <table id="progressTable">
            <thead>
              <tr>
                <th data-i18n="admin.thTeacher">Teacher</th>
                <th data-i18n="admin.thStudent">Student</th>
                <!-- Weeks will be generated -->
                <th data-i18n="admin.thTotals">Totals</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Signups View -->
    <div id="signups" class="view" style="display: none;">
      <div class="dash-header">
        <h2 class="display-3" data-i18n="admin.signupTitle">Signup Applications</h2>
      </div>

      <div class="dash-card">
        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
          <button type="button" class="status-chip status-chip-button info signup-filter active" onclick="setSignupFilter('all')" data-i18n="admin.signupFilterAll">All</button>
          <button type="button" class="status-chip status-chip-button warning signup-filter" onclick="setSignupFilter('pending')" data-i18n="admin.signupFilterPending">Pending</button>
          <button type="button" class="status-chip status-chip-button success signup-filter" onclick="setSignupFilter('approved')" data-i18n="admin.signupFilterApproved">Approved</button>
          <button type="button" class="status-chip status-chip-button danger signup-filter" onclick="setSignupFilter('rejected')" data-i18n="admin.signupFilterRejected">Rejected</button>
        </div>

        <div class="table-responsive">
          <table id="signupsTable">
            <thead>
              <tr>
                <th data-i18n="admin.signupThName">Name</th>
                <th data-i18n="admin.signupThAge">Age</th>
                <th data-i18n="admin.signupThPhone">Phone</th>
                <th data-i18n="admin.signupThContact">Contact</th>
                <th data-i18n="admin.signupThStatus">Status</th>
                <th data-i18n="admin.signupThTime">Submitted</th>
                <th data-i18n="admin.signupThAction">Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="signupEmptyState" style="padding: 40px; text-align: center; color: var(--color-text-secondary); display: none;" data-i18n="admin.signupNoRecords">
          No signup records found.
        </div>
        <div id="signupPaginationControls" style="display: flex; justify-content: center; align-items: center; gap: 12px; padding: 16px 0;">
          <button class="btn-secondary" id="signupPrevBtn" onclick="goToSignupPage(signupCurrentPage - 1)" disabled style="min-width: 80px;" data-i18n="common.prev">Prev</button>
          <span id="signupPageInfo" style="font-size: 0.9rem; color: var(--color-text-secondary);"></span>
          <button class="btn-secondary" id="signupNextBtn" onclick="goToSignupPage(signupCurrentPage + 1)" disabled style="min-width: 80px;" data-i18n="common.next">Next</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;">
    <div class="glass-card" style="width: 500px; padding: 40px; background: white; max-height: 90vh; overflow-y: auto; border-radius: 38px;">
        <h3 style="margin-bottom: 20px;" data-i18n="admin.modalTitle">New Pairing</h3>
        <form id="entryForm">
            <h4 style="font-size: 0.9rem; margin-bottom: 10px; color: var(--color-text-light);" data-i18n="admin.studentSection">Student</h4>
            <input type="text" id="sName" class="form-control" data-i18n-placeholder="admin.fieldName" placeholder="Name" style="margin-bottom: 10px;" required>
            <input type="text" id="sContact" class="form-control" data-i18n-placeholder="admin.fieldContact" placeholder="Contact" style="margin-bottom: 10px;" required>
            <input type="text" id="sUser" class="form-control" data-i18n-placeholder="admin.fieldUsername" placeholder="Username" style="margin-bottom: 10px;" required>
            <input type="email" id="sEmail" class="form-control" placeholder="Email (optional)" style="margin-bottom: 10px;">
            <input type="password" id="sPass" class="form-control" data-i18n-placeholder="admin.fieldPassword" placeholder="Password" style="margin-bottom: 20px;" required>

            <h4 style="font-size: 0.9rem; margin-bottom: 10px; color: var(--color-text-light);" data-i18n="admin.teacherSection">Teacher</h4>
            <input type="text" id="tName" class="form-control" data-i18n-placeholder="admin.fieldName" placeholder="Name" style="margin-bottom: 10px;" required>
            <input type="text" id="tUser" class="form-control" data-i18n-placeholder="admin.fieldUsername" placeholder="Username" style="margin-bottom: 10px;" required>
            <input type="email" id="tEmail" class="form-control" placeholder="Email (optional)" style="margin-bottom: 10px;">
            <input type="password" id="tPass" class="form-control" data-i18n-placeholder="admin.fieldPassword" placeholder="Password" style="margin-bottom: 20px;" required>

            <div style="text-align: right;">
                <button type="button" class="btn-secondary" onclick="closeModal()" data-i18n="admin.btnCancel">Cancel</button>
                <button type="submit" class="btn-primary" data-i18n="admin.btnCreate">Create</button>
            </div>
        </form>
    </div>
</div>

<!-- Reject Modal -->
<div id="rejectModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;">
    <div class="glass-card" style="width: 440px; padding: 40px; background: white; border-radius: 38px;">
        <h3 style="margin-bottom: 20px;" data-i18n="admin.signupRejectReason">Rejection Reason</h3>
        <textarea id="rejectReasonInput" class="form-control" rows="4" style="margin-bottom: 20px; resize: vertical;" data-i18n-placeholder="admin.signupRejectPlaceholder" placeholder="Please enter the reason for rejection..."></textarea>
        <div style="text-align: right;">
            <button type="button" class="btn-secondary" onclick="closeRejectModal()" data-i18n="admin.btnCancel">Cancel</button>
            <button type="button" class="btn-primary" onclick="confirmReject()" style="background: var(--status-error);" data-i18n="admin.signupConfirmReject">Confirm Reject</button>
        </div>
    </div>
</div>

<script type="module" src="js/runtime-config.js"></script>
<script type="module" src="js/api.js"></script>
<script type="module" src="js/demo-api.js"></script>
<script type="module" src="js/i18n.js"></script>
<script type="module" src="js/toast.js"></script>
<script>
    let pairings = [];
    let currentPage = 1;
    let totalPages = 1;
    const PAGE_SIZE = 20;
    let activeProgressFilter = 'all';

    window.toggleLang = () => {
        I18nUtils.toggleLang();
    };

    function statusChipMeta(status) {
        if (status === 'taught') return { label: 'T', className: 'success' };
        if (status === 'teacher_leave') return { label: 'TL', className: 'warning' };
        if (status === 'student_leave') return { label: 'SL', className: 'info' };
        if (status === 'sick') return { label: 'S', className: 'danger' };
        return { label: 'P', className: 'info' };
    }

    function createStatusChip(status) {
        const meta = statusChipMeta(status);
        const chip = document.createElement('span');
        chip.className = `status-chip ${meta.className}`;
        chip.textContent = meta.label;
        return chip;
    }

    function renderPairings() {
        const tbody = document.querySelector('#pairingsTable tbody');
        tbody.replaceChildren();
        const visiblePairings = getPairingsFilteredBySearch();
        if (visiblePairings.length === 0) {
            document.getElementById('emptyState').style.display = 'block';
            return;
        }

        document.getElementById('emptyState').style.display = 'none';
        visiblePairings.forEach((pairing) => {
            const row = document.createElement('tr');

            const studentCell = document.createElement('td');
            const studentName = document.createTextNode(pairing.student?.name || '-');
            const studentContact = document.createElement('span');
            studentContact.className = 'text-small';
            studentContact.textContent = pairing.student?.contact || '';
            studentCell.append(studentName, document.createElement('br'), studentContact);

            const studentLoginCell = document.createElement('td');
            studentLoginCell.textContent = pairing.student?.username || '-';

            const teacherCell = document.createElement('td');
            teacherCell.textContent = pairing.teacher?.name || '-';

            const teacherLoginCell = document.createElement('td');
            teacherLoginCell.textContent = pairing.teacher?.username || '-';

            const actionCell = document.createElement('td');
            const deleteButton = document.createElement('button');
            deleteButton.className = 'btn-danger';
            deleteButton.type = 'button';
            deleteButton.textContent = I18nUtils.t('common.delete');
            deleteButton.addEventListener('click', () => removePairing(pairing.id));
            actionCell.appendChild(deleteButton);

            row.append(studentCell, studentLoginCell, teacherCell, teacherLoginCell, actionCell);
            tbody.appendChild(row);
        });
    }

    function renderProgress() {
        const progBody = document.querySelector('#progressTable tbody');
        const progHead = document.querySelector('#progressTable thead tr');
        progHead.replaceChildren();
        const teacherHead = document.createElement('th');
        teacherHead.textContent = I18nUtils.t('admin.thTeacher');
        const studentHead = document.createElement('th');
        studentHead.textContent = I18nUtils.t('admin.thStudent');
        progHead.append(teacherHead, studentHead);
        for (let i = 1; i <= 20; i++) {
            const weekHead = document.createElement('th');
            weekHead.textContent = `W${i}`;
            progHead.appendChild(weekHead);
        }
        const totalHead = document.createElement('th');
        totalHead.textContent = I18nUtils.t('admin.thTotals');
        progHead.appendChild(totalHead);

        progBody.replaceChildren();
        const visiblePairings = getPairingsFilteredForProgress();
        visiblePairings.forEach((pairing) => {
            const statusMap = {};
            (pairing.progress?.lessons || []).forEach((lesson) => {
                const weekNumber = lesson.week_number ?? lesson.weekNumber;
                if (weekNumber) {
                    statusMap[weekNumber] = lesson.status;
                }
            });
            let total = 0;
            const row = document.createElement('tr');

            const teacherNameCell = document.createElement('td');
            teacherNameCell.textContent = pairing.teacher?.name || '-';
            const studentNameCell = document.createElement('td');
            studentNameCell.textContent = pairing.student?.name || '-';
            row.append(teacherNameCell, studentNameCell);

            for (let week = 1; week <= 20; week++) {
                const status = statusMap[week] || 'pending';
                if (status === 'taught') total += 1;
                const weekCell = document.createElement('td');
                weekCell.appendChild(createStatusChip(status));
                row.appendChild(weekCell);
            }

            const totalCell = document.createElement('td');
            totalCell.textContent = String(total);
            row.appendChild(totalCell);
            progBody.appendChild(row);
        });
    }

    function updatePaginationUI() {
        const info = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevPageBtn');
        const nextBtn = document.getElementById('nextPageBtn');
        const controls = document.getElementById('paginationControls');
        if (totalPages <= 1) {
            controls.style.display = 'none';
            return;
        }
        controls.style.display = 'flex';
        info.textContent = `${currentPage} / ${totalPages}`;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
    }

    window.goToPage = async (page) => {
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        await fetchPairings();
    };

    async function fetchPairings() {
        const result = await ApiClient.listPairings(currentPage, PAGE_SIZE);
        pairings = result.pairings || [];
        if (result.pagination) {
            totalPages = result.pagination.totalPages || 1;
            currentPage = result.pagination.page || 1;
        }
        renderPairings();
        renderProgress();
        updatePaginationUI();
    }

    window.removePairing = async (id) => {
        if (!confirm(I18nUtils.t('admin.deleteConfirm'))) return;
        try {
            await ApiClient.deletePairing(id);
            await fetchPairings();
        } catch (error) {
            showToast(error.message || I18nUtils.t('common.deleteFailed'), 'error');
        }
    };

    window.openModal = () => document.getElementById('modal').style.display = 'flex';
    window.closeModal = () => document.getElementById('modal').style.display = 'none';

    window.switchView = (id, el) => {
        document.querySelectorAll('.view').forEach((view) => {
            view.style.display = 'none';
        });
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.sidebar-item').forEach((item) => {
            item.classList.remove('active');
        });
        el.classList.add('active');
    };

    window.filterTable = () => {
        renderPairings();
    };
    window.exportCSV = () => {
        const rows = [
            ['Teacher', 'Teacher Username', 'Student', 'Student Username', 'Taught Count', 'Total Weeks']
        ];
        pairings.forEach((pairing) => {
            rows.push([
                pairing.teacher?.name || '',
                pairing.teacher?.username || '',
                pairing.student?.name || '',
                pairing.student?.username || '',
                String(pairing.progress?.taughtCount || 0),
                String(pairing.progress?.totalWeeks || 20)
            ]);
        });
        const csv = rows
            .map((cols) =>
                cols
                    .map((col) => `"${String(col).replaceAll('"', '""')}"`)
                    .join(',')
            )
            .join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `pairings-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    };
    window.setFilter = (filter) => {
        activeProgressFilter = filter;
        renderProgress();
    };

    function getPairingsFilteredBySearch() {
        const query = document.getElementById('searchInput')?.value?.trim().toLowerCase() || '';
        if (!query) return pairings;
        return pairings.filter((pairing) => {
            const haystack = [
                pairing.student?.name,
                pairing.student?.username,
                pairing.student?.contact,
                pairing.teacher?.name,
                pairing.teacher?.username,
                pairing.teacher?.contact
            ]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return haystack.includes(query);
        });
    }

    function getPairingsFilteredForProgress() {
        if (activeProgressFilter === 'all') return pairings;
        if (activeProgressFilter === 'teacher-leave') {
            return pairings.filter((pairing) =>
                (pairing.progress?.lessons || []).some((lesson) => lesson.status === 'teacher_leave')
            );
        }
        if (activeProgressFilter === 'student-leave') {
            return pairings.filter((pairing) =>
                (pairing.progress?.lessons || []).some((lesson) => lesson.status === 'student_leave')
            );
        }
        return pairings;
    }

    window.logout = async () => {
        await ApiClient.logout().catch(() => null);
        window.location.href = 'login.html';
    };

    document.getElementById('entryForm').onsubmit = async (e) => {
        e.preventDefault();
        const student = {
            name: document.getElementById('sName').value.trim(),
            contact: document.getElementById('sContact').value.trim(),
            username: document.getElementById('sUser').value.trim().toLowerCase(),
            email: document.getElementById('sEmail').value.trim() || undefined,
            password: document.getElementById('sPass').value
        };
        const teacher = {
            name: document.getElementById('tName').value.trim(),
            username: document.getElementById('tUser').value.trim().toLowerCase(),
            email: document.getElementById('tEmail').value.trim() || undefined,
            password: document.getElementById('tPass').value
        };

        try {
            await ApiClient.createPairing({ student, teacher });
            e.target.reset();
            closeModal();
            await fetchPairings();
        } catch (error) {
            showToast(error.message || I18nUtils.t('common.createFailed'), 'error');
        }
    };

    async function boot() {
        try {
            const me = await ApiClient.me();
            if (me.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            I18nUtils.applyTranslations();
            await fetchPairings();
        } catch (err) {
            if (err?.status === 401 || err?.status === 403) {
                window.location.href = 'login.html';
            } else {
                showToast(I18nUtils.t('common.networkError'), 'error');
            }
        }
    }

    // ---- Signup Management ----
    let signupsList = [];
    let signupCurrentPage = 1;
    let signupTotalPages = 1;
    let signupStatusFilter = 'all';
    let rejectingSignupId = null;

    window.setSignupFilter = (status) => {
        signupStatusFilter = status;
        signupCurrentPage = 1;
        document.querySelectorAll('.signup-filter').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        fetchSignups();
    };

    window.goToSignupPage = async (page) => {
        if (page < 1 || page > signupTotalPages) return;
        signupCurrentPage = page;
        await fetchSignups();
    };

    async function fetchSignups() {
        try {
            const result = await ApiClient.listStudentSignups(signupCurrentPage, PAGE_SIZE, signupStatusFilter);
            signupsList = result.signups || [];
            if (result.pagination) {
                signupTotalPages = result.pagination.totalPages || 1;
                signupCurrentPage = result.pagination.page || 1;
            }
            renderSignups();
            updateSignupPaginationUI();
        } catch (err) {
            showToast(err.message || I18nUtils.t('common.networkError'), 'error');
        }
    }

    function formatDate(ts) {
        if (!ts) return '-';
        var d = new Date(ts);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function signupStatusChip(status) {
        var map = {
            pending: { label: I18nUtils.t('admin.signupFilterPending'), cls: 'warning' },
            approved: { label: I18nUtils.t('admin.signupFilterApproved'), cls: 'success' },
            rejected: { label: I18nUtils.t('admin.signupFilterRejected'), cls: 'danger' }
        };
        var m = map[status] || { label: 'Unknown', cls: 'info' };
        var chip = document.createElement('span');
        chip.className = 'status-chip ' + m.cls;
        chip.textContent = m.label;
        return chip;
    }

    function renderSignups() {
        var tbody = document.querySelector('#signupsTable tbody');
        tbody.replaceChildren();
        if (signupsList.length === 0) {
            document.getElementById('signupEmptyState').style.display = 'block';
            return;
        }
        document.getElementById('signupEmptyState').style.display = 'none';

        signupsList.forEach(function (s) {
            var row = document.createElement('tr');

            var nameCell = document.createElement('td');
            nameCell.textContent = s.childName;

            var ageCell = document.createElement('td');
            ageCell.textContent = s.age;

            var phoneCell = document.createElement('td');
            phoneCell.textContent = s.phone;

            var contactCell = document.createElement('td');
            contactCell.textContent = s.contact || '-';

            var statusCell = document.createElement('td');
            statusCell.appendChild(signupStatusChip(s.status));
            if (s.status === 'rejected' && s.rejectReason) {
                var reasonSpan = document.createElement('div');
                reasonSpan.className = 'text-small';
                reasonSpan.style.color = 'var(--status-error)';
                reasonSpan.textContent = s.rejectReason;
                statusCell.appendChild(reasonSpan);
            }

            var timeCell = document.createElement('td');
            timeCell.textContent = formatDate(s.createdAt);

            var actionCell = document.createElement('td');
            if (s.status === 'pending') {
                var approveBtn = document.createElement('button');
                approveBtn.className = 'btn-primary';
                approveBtn.style.cssText = 'font-size: 0.8rem; padding: 4px 12px; margin-right: 4px;';
                approveBtn.textContent = I18nUtils.t('admin.signupApprove');
                approveBtn.addEventListener('click', function () { approveSignup(s.id); });

                var rejectBtn = document.createElement('button');
                rejectBtn.className = 'btn-danger';
                rejectBtn.style.cssText = 'font-size: 0.8rem; padding: 4px 12px;';
                rejectBtn.textContent = I18nUtils.t('admin.signupReject');
                rejectBtn.addEventListener('click', function () { openRejectModal(s.id); });

                actionCell.append(approveBtn, rejectBtn);
            } else {
                actionCell.textContent = '-';
            }

            row.append(nameCell, ageCell, phoneCell, contactCell, statusCell, timeCell, actionCell);
            tbody.appendChild(row);
        });
    }

    function updateSignupPaginationUI() {
        var info = document.getElementById('signupPageInfo');
        var prevBtn = document.getElementById('signupPrevBtn');
        var nextBtn = document.getElementById('signupNextBtn');
        var controls = document.getElementById('signupPaginationControls');
        if (signupTotalPages <= 1) {
            controls.style.display = 'none';
            return;
        }
        controls.style.display = 'flex';
        info.textContent = signupCurrentPage + ' / ' + signupTotalPages;
        prevBtn.disabled = signupCurrentPage <= 1;
        nextBtn.disabled = signupCurrentPage >= signupTotalPages;
    }

    window.approveSignup = async (id) => {
        try {
            await ApiClient.reviewStudentSignup(id, { action: 'approve' });
            await fetchSignups();
        } catch (err) {
            if (err.status === 409) {
                showToast(I18nUtils.t('admin.signupAlreadyReviewed'), 'error');
            } else {
                showToast(err.message || I18nUtils.t('common.submitFailed'), 'error');
            }
        }
    };

    window.openRejectModal = (id) => {
        rejectingSignupId = id;
        document.getElementById('rejectReasonInput').value = '';
        document.getElementById('rejectModal').style.display = 'flex';
    };

    window.closeRejectModal = () => {
        rejectingSignupId = null;
        document.getElementById('rejectModal').style.display = 'none';
    };

    window.confirmReject = async () => {
        var reason = document.getElementById('rejectReasonInput').value.trim();
        if (!reason) {
            showToast(I18nUtils.t('admin.signupRejectReason'), 'error');
            return;
        }
        try {
            await ApiClient.reviewStudentSignup(rejectingSignupId, { action: 'reject', reason: reason });
            closeRejectModal();
            await fetchSignups();
        } catch (err) {
            if (err.status === 409) {
                showToast(I18nUtils.t('admin.signupAlreadyReviewed'), 'error');
            } else {
                showToast(err.message || I18nUtils.t('common.submitFailed'), 'error');
            }
        }
    };

    // Override switchView to also load signups when switching to that view
    const originalSwitchView = window.switchView;
    window.switchView = (id, el) => {
        originalSwitchView(id, el);
        if (id === 'signups') {
            fetchSignups();
        }
    };

    document.addEventListener('DOMContentLoaded', boot, { once: true });
</script>
</body>
</html>
